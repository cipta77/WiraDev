version: "3.8"

services:
  # ==========================================
  # Database Service (MySQL 8.0)
  # ==========================================
  database:
    image: mysql:8.0
    container_name: wiradev_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secure_password}
      MYSQL_DATABASE: ${DB_NAME:-hifi_db}
      MYSQL_USER: ${DB_USER:-hifi_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hifi_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - wiradev_db_data:/var/lib/mysql
      - ./wiradev-be/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - wiradev_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secure_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Database Management GUI (phpMyAdmin)
  # ==========================================
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: wiradev_phpmyadmin
    restart: always
    environment:
      PMA_HOST: database
      PMA_USER: ${DB_USER:-hifi_user}
      PMA_PASSWORD: ${DB_PASSWORD:-hifi_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secure_password}
    ports:
      - "8080:80"
    networks:
      - wiradev_network
    depends_on:
      database:
        condition: service_healthy

  # ==========================================
  # AI Microservice (Flask / TensorFlow)
  # ==========================================
  ai:
    build:
      context: ./wiradev-ai
      dockerfile: Dockerfile
    container_name: wiradev_ai
    restart: always
    environment:
      - PORT=7860
    ports:
      - "7860:7860"
    networks:
      - wiradev_network

  # ==========================================
  # Backend API (Express / TypeScript)
  # ==========================================
  backend:
    build:
      context: ./wiradev-be
      dockerfile: Dockerfile
    container_name: wiradev_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: ${DB_USER:-hifi_user}
      DB_PASSWORD: ${DB_PASSWORD:-hifi_password}
      DB_NAME: ${DB_NAME:-hifi_db}
      AI_SERVICE_URL: http://ai:7860
    ports:
      - "5000:5000"
    networks:
      - wiradev_network
    depends_on:
      database:
        condition: service_healthy
      ai:
        condition: service_started

  # ==========================================
  # Frontend Web Client (Next.js)
  # ==========================================
  frontend:
    build:
      context: ./wiradev-fe
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:5000
        - NEXT_PUBLIC_AI_API_URL=http://localhost:5000
    container_name: wiradev_frontend
    restart: always
    ports:
      - "3000:3000"
    networks:
      - wiradev_network
    depends_on:
      - backend

networks:
  wiradev_network:
    driver: bridge

volumes:
  wiradev_db_data:
    driver: local
